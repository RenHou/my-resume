<section class="hero">
  <div class="hero-content">
    <span class="badge">Available for hire</span>
    <div class="accent-bar"></div>
    <h1 class="hero-name">{{ name }}</h1>
    <p class="hero-title">{{ jobTitle }}</p>
    <p class="hero-bio">{{ bio }}</p>
    <div class="btn-group">
      <button class="btn-secondary" [routerLink]="['/project']">View projects</button>
    </div>
    <div class="stats">
      <div class="stat"><span class="stat-val">{{ yearsExp }}+</span><span class="stat-lbl">Years experience</span></div>
      <div class="stat"><span class="stat-val">{{ projectCount }}</span><span class="stat-lbl">Projects done</span></div>
      <div class="stat"><span class="stat-val">{{ certCount }}</span><span class="stat-lbl">Certifications</span></div>
    </div>
  </div>

   <div class="photo-box">
    @if (photoUrl) {
      <img [src]="photoUrl" alt="Profile photo" class="photo-img" />
    } @else {
      <div class="photo-frame">
        <div class="photo-icon"></div>
        <span class="photo-label">Profile photo</span>
      </div>
    }
  </div>
</section>
