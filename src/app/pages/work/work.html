<div class="page-wrapper">
  <div class="page-header">
    <span class="page-tag">My experience</span>
    <h1 class="page-title">Work experience</h1>
    <div class="accent-bar"></div>
  </div>

  <div class="timeline">
    @for (job of workList; track job.company) {
      <div class="timeline-item">
        <div class="work-card">
          <div class="work-top">
            <span class="work-company">{{ job.company }}</span>
            <span class="work-period">{{ job.period }}</span>
          </div>
          <div class="work-meta">
            <span class="work-role">{{ job.role }}</span>
            <span class="work-badge">{{ job.type }} · {{ job.duration }}</span>
          </div>
          <ul class="work-duties">
            @for (duty of job.duties; track duty) {
              <li>
                <div class="duty-dot"></div>
                <span>{{ duty }}</span>
              </li>
            }
          </ul>
        </div>
      </div>
    }
  </div>
</div>
